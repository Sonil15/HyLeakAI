# Publishes app/web/ to GitHub Pages.
#
# One manual step is required before the first run and cannot be done from
# code: Settings -> Pages -> Source -> GitHub Actions. Until that is set, this
# workflow will fail at the deploy step with a "Pages is not enabled" error.
name: Deploy frontend to Pages

on:
  push:
    branches: [main]
    paths: ["app/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web
      - id: deployment
        uses: actions/deploy-pages@v4
