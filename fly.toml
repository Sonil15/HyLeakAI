# Fly.io configuration — one app serving both the API and the frontend.
#
# Replaces render.yaml (backend) and .github/workflows/pages.yml (frontend).
# Deploy with:
#     fly deploy --build-secret hyleak_token=$HYLEAK_GITHUB_TOKEN

app = "hyleakai"

# bom = Mumbai. Pick the region nearest whoever is using the demo; latency to a
# US region from India adds ~200 ms per request. `fly platform regions` lists
# the rest.
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  # Duplicated from the Dockerfile so the paths are visible in `fly config show`
  # and overridable without a rebuild.
  HYLEAK_DATA_DIR = "/app/runtime_artifacts/data"
  HYLEAK_CHECKPOINT = "/app/runtime_artifacts/checkpoints/unet_small_best.pt"
  HYLEAK_OUTPUT_DIR = "/app/runtime_artifacts/outputs"
  # The frontend is served from this same origin, so CORS is not needed in
  # normal operation. This keeps a local dev server working against the
  # deployed API.
  HYLEAK_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[http_service]
  internal_port = 8080
  force_https = true
  processes = ["app"]

  # Scale to zero when idle. Cheap, but the first request after an idle period
  # pays a cold start: machine boot plus a torch import plus an 89 MB checkpoint
  # load, so roughly 15-30 s.
  #
  # BEFORE A LIVE DEMO OR JUDGING, set min_machines_running = 1 and redeploy.
  # A judge hitting a cold URL and waiting half a minute is the one failure
  # mode worth paying a few cents a day to avoid.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    # Generous: the app answers /health only after the model has loaded, and a
    # short grace period would make Fly kill the machine mid-startup and loop.
    grace_period = "40s"

[[vm]]
  size = "shared-cpu-1x"
  # NOT the 256 MB default. torch plus the U-Net plus a 125 MB memory-mapped
  # array does not fit; the machine would be OOM-killed during model load.
  memory = "1gb"
